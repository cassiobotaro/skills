name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Repository rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The version check reads plugin.json at the commit the push started from.
          fetch-depth: 0

      - name: Check manifests, frontmatter, references and version bumps
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/validate.py --base "$BASE"
